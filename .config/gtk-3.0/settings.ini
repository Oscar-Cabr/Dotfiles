# ~/.config/gtk-3.0/settings.ini
#
# GSettings (org.gnome.desktop.interface) wins over this file whenever a
# settings portal is running, which it is here (xdg-desktop-portal-gtk under
# Hyprland). Keep the two in sync; see ~/.config/theme/RELOAD.txt.
#
# Theme lives at ~/.themes/Leonardita-Sunset/gtk-3.0/gtk.css
[Settings]
gtk-theme-name=Leonardita-Sunset
gtk-icon-theme-name=Papirus-Dark
gtk-font-name=Noto Sans 10
gtk-application-prefer-dark-theme=1
