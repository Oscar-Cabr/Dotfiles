# ~/.config/gtk-4.0/settings.ini
#
# GTK4 counterpart of ~/.config/gtk-3.0/settings.ini. As with GTK3, GSettings
# wins while a settings portal is running; keep the two in sync.
#
# NOTE: libadwaita applications ignore gtk-theme-name entirely. They are
# recoloured through ~/.config/gtk-4.0/gtk.css, which imports
# ~/.themes/Leonardita-Sunset/gtk-4.0/gtk.css.
[Settings]
gtk-theme-name=Leonardita-Sunset
gtk-icon-theme-name=Papirus-Dark
gtk-font-name=Noto Sans 10
gtk-application-prefer-dark-theme=1
