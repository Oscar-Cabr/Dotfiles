font_family          RobotoMono Nerd Font
bold_font            auto
italic_font          auto
bold_italic_font     auto
font_size            17

# Ligature support
font_features        RobotoMono-Regular +liga +calt
font_features        RobotoMono-Bold    +liga +calt

cursor_shape              beam
cursor_beam_thickness     1.5
cursor_blink_interval     0.5
cursor_stop_blinking_after 10.0

scrollback_lines     10000
wheel_scroll_multiplier 5.0

window_padding_width        10
single_window_margin_width  0
window_border_width         1pt
active_border_color         #89b4fa
inactive_border_color       #313244
draw_minimal_borders        yes

# Hide the title bar chrome; the window still has a drag area
hide_window_decorations     titlebar-only

# Keep the macOS traffic lights (close/minimize/maximize) visible
macos_titlebar_color        background

tab_bar_style             powerline
tab_powerline_style       slanted
tab_bar_min_tabs          1
tab_bar_edge              bottom
active_tab_font_style     bold
inactive_tab_font_style   normal

active_tab_foreground     #1e1e2e
active_tab_background     #89b4fa
inactive_tab_foreground   #cdd6f4
inactive_tab_background   #181825
tab_bar_background        #11111b

# Colors
foreground    #cdd6f4
background    #1e1e2e

selection_foreground  #1e1e2e
selection_background  #f5e0dc

# Cursor
cursor            #f5e0dc
cursor_text_color #1e1e2e

# URL highlight on hover
url_color         #89dceb
url_style         curly

# 16 terminal colors
# black
color0   #45475a
color8   #585b70
# red
color1   #f38ba8
color9   #f38ba8
# green
color2   #a6e3a1
color10  #a6e3a1
# yellow
color3   #f9e2af
color11  #f9e2af
# blue
color4   #89b4fa
color12  #89b4fa
# magenta
color5   #f5c2e7
color13  #f5c2e7
# cyan
color6   #94e2d5
color14  #94e2d5
# white
color7   #bac2de
color15  #a6adc8

repaint_delay    10
input_delay      3
sync_to_monitor  yes

macos_option_as_alt        yes   # makes Alt key work in Vim, etc.
macos_quit_when_last_window_closed yes
macos_window_resizable     yes
macos_thicken_font         0

shell_integration  enabled

# Launch new terminal window
map cmd+enter        launch --location=vsplit --cwd=current
map cmd+shift+enter  launch --location=hsplit --cwd=current

# Navigate between panes
map ctrl+h  neighboring_window left
map ctrl+l  neighboring_window right
map ctrl+k  neighboring_window top
map ctrl+j  neighboring_window bottom

# Tabs
map cmd+t  new_tab_with_cwd
map cmd+w  close_tab
map cmd+]  next_tab
map cmd+[  previous_tab

# New window in same dir
map cmd+n  new_window_with_cwd

# Increase / decrease font size
map cmd+equal  change_font_size all +1.0
map cmd+minus  change_font_size all -1.0
map cmd+0      change_font_size all 0

# Scroll
map cmd+up    scroll_to_prompt -1
map cmd+down  scroll_to_prompt 1

enabled_layouts Tall, *
